########################################################################################################################
#
# zEssentials - Tab List
# Header and footer of the player list, per world, with animations support
# through placeholder frames.
#
########################################################################################################################

enable: true

# Seconds between tab list refreshes, keeps placeholders like %ping% accurate
refresh-seconds: 5

# Per world header and footer, each entry supports MiniMessage, legacy colors,
# hex and PlaceholderAPI. Multiple lines are allowed as list entries.
# "default" applies to every world without its own section.
worlds:
  default:
    header:
      - "&#00d4ff&lzEssentials"
      - "&7Playing on &#ffd93d%player_world%"
    footer:
      - "&7Online&8: &f%server_online% &8• &7Ping&8: &f%player_ping%ms"
      - "&#00d4ffstore.yourserver.com"

# Per group header and footer, checked by permission before world entries.
# The first matching group wins. Remove or comment out if not needed.
# groups:
#   admin:
#     permission: "essentials.tablist.admin"
#     header:
#       - "&#ff4d4d&lADMIN"
#     footer:
#       - "&7Staff mode active"
#   vip:
#     permission: "essentials.tablist.vip"
#     header:
#       - "&#ffd93d&lVIP"
#     footer:
#       - "&7Thanks for supporting!"

# ── Animations ───────────────────────────────────────────────
# Named frame lists cycled on every refresh tick.
# Use %anim_<name>% inside header/footer lines to display the current frame.
# Speed is controlled by the refresh-seconds setting.
animations:
  gradient-title:
    interval-seconds: 1
    frames:
      - "&#00d4ff&lz"
      - "&#10b4ff&le"
      - "&#209aff&ls"
      - "&#3080ff&ls"
      - "&#4066ff&le"
      - "&#504cff&ln"
      - "&#6032ff&lt"
      - "&#7018ff&li"
      - "&#7b2fff&la"
      - "&#7b2fff&ll"
      - "&#7b2fff&ls"

# Example usage inside header:
#   header:
#     - "%anim_gradient-title% &7» &f%player_world%"
