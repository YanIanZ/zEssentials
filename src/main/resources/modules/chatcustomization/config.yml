########################################################################################################################
#
# zEssentials - Chat Customization
# Per player chat color, decorations and prefix tags through guis.
#
########################################################################################################################

enable: true

# Permission needed to open both guis
use-permission: "essentials.chatcustomization.use"

# Players with this permission can pick decorations like bold and italic
decorations-permission: "essentials.chatcustomization.decorations"

# Prefix tags a player can choose from, permission empty means everyone.
# The tag text is inserted before the message in the chat format.
# Tags render as symbol prefixes BEFORE the rank and the player name.
tags:
  - name: "&7None"
    text: ""
    permission: ""
  - name: "&#00d4ff&l✦ PRO"
    text: "&#00d4ff&l✦ "
    permission: "essentials.tags.pro"
  - name: "&#a7ff33&l❈ VIP"
    text: "&#a7ff33&l❈ "
    permission: "essentials.tags.vip"
  - name: "&#ffd93d&l▶ YT"
    text: "&#ffd93d&l▶ "
    permission: "essentials.tags.yt"
  - name: "&#ff4d4d&l⚔ MOD"
    text: "&#ff4d4d&l⚔ "
    permission: "essentials.tags.mod"
