########################################################################################################################
#
# zEssentials - NameTags & Tab Sorting
# Prefix/suffix above player heads and tab list ordering through
# scoreboard teams, the same mechanism the TAB plugin uses.
#
########################################################################################################################

# Config schema version — do not edit
config-version: 1

enable: true

# Seconds after join before the nametag applies, gives LuckPerms and
# PlaceholderAPI time to resolve prefixes
apply-delay-ticks: 20

# Sorting: players are ordered by their team name inside the tab list,
# so lower priorities appear first. Zero padded automatically.

# When ladder-sort is true, each player gets a unique team combining
# the group priority with the player name, producing a fully ordered
# ladder where every slot has a distinct sort position.
# When false (default), all players in the same group share one team.
ladder-sort: false

# First matching rule wins. Every field supports legacy colors, hex
# &#rrggbb, MiniMessage and PlaceholderAPI with the player context.
groups:

  - permission: "essentials.groups.admin"
    priority: 0
    prefix: "&#ff4d4d&l⚔ ADMIN "
    suffix: ""
    tab-name-format: "&#ff4d4d%player%"

  - permission: "essentials.groups.mod"
    priority: 100
    prefix: "&#ffd93d&l❈ MOD "
    suffix: ""
    tab-name-format: "&#ffd93d%player%"

  - permission: "essentials.groups.vip"
    priority: 300
    prefix: "&#a7ff33&l★ VIP "
    suffix: ""
    tab-name-format: "&#a7ff33%player%"

  - permission: ""
    priority: 500
    prefix: ""
    suffix: ""
    tab-name-format: "&7%player%"

# ── Below name objective ──────────────────────────────────────
# Shows a number below every player nametag.
# mode: HEALTH (auto sync, no task needed) or PLACEHOLDER (refreshed on timer)
belowname:
  enabled: true
  mode: HEALTH
  display-name: "&#ff4d4d♥ Health"
  # Only used when mode is PLACEHOLDER, PAPI placeholders with player context
  placeholder: "%player_health%"
  # Seconds between below name score updates in PLACEHOLDER mode
  refresh-seconds: 3

# ── Spectator fix ─────────────────────────────────────────────
# Players in spectator mode get a gray tab name instead of their normal one.
spectator:
  enabled: true
  tab-name-format: "&8&oSpectator"
