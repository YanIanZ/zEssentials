########################################################################################################################
#
# zEssentials - Reports
# Players report others, staff review and resolve them.
#
########################################################################################################################

# Config schema version — do not edit
config-version: 1

enable: true

# Seconds between two reports of the same player
cooldown-seconds: 60

# Maximum amount of stored resolved reports per target
resolved-history: 100

# Notify every moderator joining that reports are waiting
notify-staff-on-join: true
