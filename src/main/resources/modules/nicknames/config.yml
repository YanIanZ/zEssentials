########################################################################################################################
#
# zEssentials - Nicknames & Disguise
# Players change their own display name, staff can change it for anyone.
# Disguise changes name + skin at the packet level via ProtocolLib.
#
########################################################################################################################

# Config schema version — do not edit
config-version: 2

enable: true

# Maximum length of a nickname
max-length: 16

# Allowed characters of a nickname
regex: "^[a-zA-Z0-9_&#§xﬀ0-9a-f]{1,32}$"

# Block nicknames equal or similar to the name of another player (impersonation)
block-impersonation: true

# Colors players can use without a special permission.
# When false the nickname is stripped from every color code unless
# the player has essentials.nicknames.color
allow-colors: true

cooldown-seconds: 60

# Hypixel-style /nick — /nick with no arguments gives a random anonymous
# identity (random username from this pool + matching skin from Mojang).
# IMPORTANT: these must be REAL Minecraft usernames, otherwise the Mojang
# API cannot resolve their skin and the nick is applied name-only.
random-nick-pool:
  - Notch
  - jeb_
  - Dinnerbone
  - Grumm
  - deadmau5
  - MidasGolden
  - Xisuma
  - Mumbo
  - Grian
  - Etho
  - BdoubleO100
  - Keralis1
  - ZedaphPlays
  - TangoTek
  - ImpulseSV
  - Cubfan135
  - Welsknight
  - FalseSymmetry
  - Stressmonster101
  - Renthedog

# Disguise settings — changes name AND skin at the packet level
disguise:
  # Master toggle for the disguise system
  enable: true

  # Whether the disguised player sees their own disguise in F5/third-person view
  self-view: false

  # Remove mob-disguised players from the tab list (LibsDisguises-style)
  hide-from-tab: true

  # When the Mojang skin fetch fails, apply the player's own skin instead
  # of leaving the nickname skinless
  fallback-own-skin: true

  # Cooldown between disguise changes (seconds)
  cooldown-seconds: 120

  # How long to cache fetched skins from the Mojang API (hours)
  skin-cache-hours: 24

  # Block disguising as staff members (players with essentials.disguise.use)
  block-staff: false

  # Random disguise pool — /disguise random picks from this list
  # These are Minecraft usernames; skins are fetched from Mojang
  random-pool:
    - Notch
    - jeb_
    - Dinnerbone
    - Grumm
    - deadmau5
    - MidasGolden

  # Mob disguise — /disguise mob <type> transforms the player into a mob
  # List of allowed mob types. Players can only disguise as these.
  # Full list at https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
  allowed-mobs:
    - ZOMBIE
    - SKELETON
    - CREEPER
    - SPIDER
    - CAVE_SPIDER
    - ENDERMAN
    - BLAZE
    - WITCH
    - PIG
    - COW
    - SHEEP
    - CHICKEN
    - WOLF
    - OCELOT
    - BAT
    - SLIME
    - MAGMA_CUBE
    - GHAST
    - ZOMBIFIED_PIGLIN
    - VILLAGER
    - IRON_GOLEM
    - SNOWMAN
    - WITHER
    - ENDER_DRAGON
