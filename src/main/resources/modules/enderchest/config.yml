########################################################################################################################
#
# zEssentials - Ender Chest
# Custom Hypixel SkyBlock-style enderchest with pagination and permission-sized pages.
#
########################################################################################################################

# Config schema version — do not edit
config-version: 1

enable: true

# Default number of pages for players without a page permission.
default-pages: 1

# Maximum pages any player can have (hard cap).
max-pages: 3

# Title shown at the top of the enderchest GUI.
# %page% and %total% placeholders are available.
title: "#3f3f3fᴇɴᴅᴇʀ ᴄʜᴇꜱᴛ &8(&f%page%&8/&f%total%&8)"

# Navigation row configuration (bottom row, slots 45-53).
nav-row:
  filler-material: GRAY_STAINED_GLASS_PANE
  filler-color: "&8"
  first-button: SPECTRAL_ARROW
  first-text: "&7« First Page"
  prev-button: ARROW
  prev-text: "&7← Previous Page"
  next-button: ARROW
  next-text: "&7Next Page →"
  last-button: SPECTRAL_ARROW
  last-text: "&7Last Page »"
  close-button: BARRIER
  close-text: "&cClose"
  page-indicator: true
  page-indicator-text: "&fPage &e%current% &7/ &e%total%"

# Hypixel SkyBlock style overview — /enderchest opens this page selector
overview:
  enable: true
  title: "#3f3f3fᴇɴᴅᴇʀ ᴄʜᴇꜱᴛ"
  info-material: ENDER_CHEST
  info-text: "#3f3f3fᴇɴᴅᴇʀ ᴄʜᴇꜱᴛ"
  info-lore:
    - "&7Select a page below to view"
    - "&7your ender chest storage."
  page-material: ENDER_EYE
  page-text: "#3f3f3fᴘᴀɢᴇ &e%page%"
  page-lore:
    - "&7Click to open this page."
  locked-material: GRAY_DYE
  locked-text: "&cPage &e%page% &8(Locked)"
  locked-lore:
    - "&7Unlock more pages with"
    - "&7essentials.enderchest.pages.<n>"
